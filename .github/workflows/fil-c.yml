name: FIL-C Memory Safety

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: release

jobs:
  fil-c:
    name: Ubuntu FIL-C
    runs-on: ubuntu-latest

    steps:
    - name: Set MULLE_HOSTNAME
      run: |
        name="${GITHUB_REF##*/}"
        MULLE_HOSTNAME="${MULLE_HOSTNAME:-ci-${name##*-}}"
        echo "MULLE_HOSTNAME=${MULLE_HOSTNAME}" >> $GITHUB_ENV

    - name: Add to path
      run: echo "$HOME/bin" >> $GITHUB_PATH

    - uses: actions/checkout@v4

    - name: Install FIL-C
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        tag=$(gh api repos/pizlonator/fil-c/releases/latest --jq .tag_name)
        version="${tag#v}"
        arch="$(uname -m)"
        echo "Installing Fil-C ${version} (${arch}) into /opt/fil"
        curl -fL -o optfil.tar.xz "https://github.com/pizlonator/fil-c/releases/download/${tag}/optfil-${version}-linux-${arch}.tar.xz"
        tar xf optfil.tar.xz
        cd "optfil-${version}-linux-${arch}"
        sudo ./setup.sh --unattended
        echo "/opt/fil/bin" >> "$GITHUB_PATH"

    - name: Verify FIL-C
      run: filcc --version

    - uses: mulle-sde/github-ci@v2

    - name: Mulle-SDE Fetch
      run: mulle-sde fetch

    - name: Mulle-SDE Craft
      run: mulle-sde -DCC=filcc craft --${BUILD_TYPE:-release}

    - name: Mulle-SDE Test
      run: |
        [ ! -d test ] || mulle-sde -DCC=filcc test
